---
apiVersion: v1
kind: Namespace
metadata:
  name: nginx-fabric
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: nginx
  namespace: nginx-fabric
spec:
  type: oci
  interval: 5m
  url: oci://ghcr.io/nginx/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nginx-fabric
  namespace: nginx-fabric
spec:
  releaseName: nginx-fabric
  interval: 30m
  chart:
    spec:
      chart: nginx-gateway-fabric
      sourceRef:
        kind: HelmRepository
        name: nginx
  values:
    nginx:
      service:
        loadBalancerIP: 10.0.30.192
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: nginx-fabric
  namespace: nginx-fabric
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: nginx-gateway-fabric
  podMetricsEndpoints:
    - targetPort: 9113
