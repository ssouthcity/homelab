apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
spec:
  releaseName: metallb
  interval: 30m
  chart:
    spec:
      chart: metallb
      version: ~0
      sourceRef:
        kind: HelmRepository
        name: metallb
  values:
    prometheus:
      namespace: monitoring
      serviceAccount: kube-prometheus-stack-metallb
      serviceMonitor:
        enabled: true
        speaker:
          additionalLabels:
            release: kube-prometheus-stack
        controller:
          additionalLabels:
            release: kube-prometheus-stack
