apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cert-manager
resources:
  - helmrelease.yaml
  - ocirepository.yaml
  - namespace.yaml
configMapGenerator:
  - name: dashboards
    options:
      labels:
        grafana_dashboard: "1"
    files:
      - ./dashboards/cert-manager.json
