apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: seerr
spec:
  interval: 5m
  url: oci://ghcr.io/seerr-team/seerr/seerr-chart
  ref:
    semver: ~3
  layerSelector:
    mediaType: "application/vnd.cncf.helm.chart.content.v1.tar+gzip"
    operation: extract
  verify:
    provider: cosign
    matchOIDCIdentity:
      - issuer: "^https://token.actions.githubusercontent.com$"
        subject: "^https://github.com/seerr-team/seerr/.github/workflows/helm.yml@refs/heads/develop$"
