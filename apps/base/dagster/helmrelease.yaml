apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: dagster
spec:
  releaseName: dagster
  interval: 1h
  chart:
    spec:
      chart: dagster
      version: ~1
      sourceRef:
        kind: HelmRepository
        name: dagster
  values:
    extraManifests:
      - apiVersion: gateway.networking.k8s.io/v1
        kind: HTTPRoute
        metadata:
          name: dagster-webserver
          annotations:
            gethomepage.dev/enabled: "true"
            gethomepage.dev/name: Dagster
            gethomepage.dev/group: Data Engineering
            gethomepage.dev/description: Data Orchestrator
            gethomepage.dev/icon: dagster-light.png
            gethomepage.dev/pod-selector: ""
        spec:
          parentRefs:
            - name: http
              namespace: gateway-system
          hostnames:
            - "dagster.southcity.dev"
          rules:
            - backendRefs:
                - name: dagster-dagster-webserver
                  port: 80
