apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  image: ghcr.io/home-assistant/home-assistant
  interval: 5h
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: home-assistant
  namespace: home-assistant
spec:
  imageRepositoryRef:
    name: home-assistant
  policy:
    semver:
      range: "*"
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: default
  namespace: home-assistant
spec:
  interval: 30m
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        name: fluxcdbot
        email: fluxcdbot@users.noreply.github.com
      messageTemplate: |
        chore(home-assistant): update image versions to {{ range .Changed.Changes }}{{ .NewValue }} {{ end }}
    push:
      branch: main
