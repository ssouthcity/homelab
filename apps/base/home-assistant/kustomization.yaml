apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: home-assistant
resources:
  - deployment.yaml
  - image.yaml
  - namespace.yaml
  - pvc.yaml
  - route.yaml
  - service.yaml
configMapGenerator:
  - name: home-assistant-configuration
    files:
      - ./config/configuration.yaml
