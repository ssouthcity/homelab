apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lakekeeper
spec:
  releaseName: lakekeeper
  interval: 1h
  chart:
    spec:
      chart: lakekeeper
      version: ~0
      sourceRef:
        kind: HelmRepository
        name: lakekeeper
  valuesFrom:
    - kind: Secret
      name: lakekeeper-oidc-credentials
      valuesKey: issuer_url
      targetPath: auth.oauth2.providerUri
    - kind: Secret
      name: lakekeeper-oidc-credentials
      valuesKey: client_id
      targetPath: auth.oauth2.ui.clientID
