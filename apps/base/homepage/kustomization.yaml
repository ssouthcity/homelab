apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: homepage
resources:
  - deployment.yaml
  - namespace.yaml
  - route.yaml
  - service-account.yaml
  - service.yaml
labels:
  - pairs:
      app.kubernetes.io/name: homepage
configMapGenerator:
  - name: homepage
    files:
      - ./config/bookmarks.yaml
      - ./config/docker.yaml
      - ./config/kubernetes.yaml
      - ./config/services.yaml
      - ./config/settings.yaml
      - ./config/widgets.yaml
