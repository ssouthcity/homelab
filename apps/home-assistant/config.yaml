apiVersion: v1
kind: ConfigMap
metadata:
  name: home-manager
data:
  configuration.yaml: |
    default_config:

    frontend:
      themes: !include_dir_merge_named themes

    automation: !include automations.yaml
    script: !include scripts.yaml
    scene: !include scenes.yaml

    http:
      use_x_forwarded_for: true
      trusted_proxies:
        - 10.42.1.0/24 # traefik
        - 127.0.0.1
        - ::1
  automations.yaml: |
