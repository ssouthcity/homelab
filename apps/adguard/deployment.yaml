apiVersion: apps/v1
kind: Deployment
metadata:
  name: adguard
spec:
  replicas: 1
  template:
    spec:
      initContainers:
      - name: readonly-conf-workaround
        image: busybox:1.32
        command: ["cp", "/tmp/AdGuardHome.yaml", "/opt/adguardhome/conf/AdGuardHome.yaml"]
        volumeMounts:
        - name: adguard-conf
          mountPath: /opt/adguardhome/conf
        - name: adguard-conf-map
          mountPath: /tmp
      containers:
      - name: adguard-home
        image: adguard/adguardhome # {"$imagepolicy": "adguard:adguardhome"}
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 53
          name: dns
          protocol: UDP
        - containerPort: 80
          name: web
          protocol: TCP
        volumeMounts:
        - name: adguard-data
          mountPath: /opt/adguardhome/work
        - name: adguard-conf
          mountPath: /opt/adguardhome/conf
      volumes:
      - name: adguard-data
        persistentVolumeClaim:
          claimName: adguard-data
      - name: adguard-conf
        persistentVolumeClaim:
          claimName: adguard-conf
      - name: adguard-conf-map
        configMap:
          name: adguard-conf
