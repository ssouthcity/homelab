name: update-flux
on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"
permissions:
  contents: write
  pull-requests: write
jobs:
  components:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Setup Flux CLI
        uses: fluxcd/flux2/action@main
      - name: Check for updates
        id: update
        run: "flux install \\\n  --export > ./clusters/homelab/flux-system/gotk-components.yaml\n\nVERSION=\"$(flux -v)\"\necho \"flux_version=$VERSION\" >> $GITHUB_OUTPUT          \n"
      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: update-flux
          commit-message: Update flux to ${{ steps.update.outputs.flux_version }}
          title: Update flux to ${{ steps.update.outputs.flux_version }}
          body: |
            ${{ steps.update.outputs.flux_version }}
