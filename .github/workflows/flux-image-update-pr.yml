name: Auto PR for Flux Image Updates

on:
  push:
    branches:
      - 'image-update-*'

jobs:
  auto-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Extract image name from branch
        id: extract-image
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          IMAGE_NAME=$(echo "$BRANCH_NAME" | sed 's/image-update-//')
          echo "image-name=$IMAGE_NAME" >> $GITHUB_OUTPUT

      - name: Check if PR already exists
        id: check-pr
        run: |
          IMAGE_NAME="${{ steps.extract-image.outputs.image-name }}"
          PR_COUNT=$(gh pr list --head "image-update-$IMAGE_NAME" --state open --json number --jq 'length')
          echo "pr-count=$PR_COUNT" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Pull Request
        if: steps.check-pr.outputs.pr-count == '0'
        run: |
          IMAGE_NAME="${{ steps.extract-image.outputs.image-name }}"
          BRANCH_NAME="image-update-$IMAGE_NAME"
          
          # Get the commit details
          COMMIT_HASH=$(git rev-parse HEAD)
          COMMIT_MESSAGE=$(git log -1 --pretty=format:"%s")
          
          # Create PR with descriptive title and body
          gh pr create \
            --title "feat: Update $IMAGE_NAME image" \
            --body "$(cat <<EOF
          ## Image Update
          
          This PR updates the \`$IMAGE_NAME\` container image to a new version automatically detected by Flux.
          
          **Source Branch:** \`$BRANCH_NAME\`  
          **Commit:** $COMMIT_HASH  
          **Commit Message:** $COMMIT_MESSAGE  
          
          ### Changes
          - Updated image tag in the deployment manifest
          
          ### Verification
          This PR was automatically generated by Flux image update automation. After review and approval, the new image will be deployed to the cluster.
          
          ---
          *This PR was created automatically by GitHub Actions workflow based on Flux image update.*
          EOF
          )" \
            --base main \
            --head "$BRANCH_NAME" \
            --label "image-update" \
            --label "automated"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: PR already exists
        if: steps.check-pr.outputs.pr-count != '0'
        run: |
          IMAGE_NAME="${{ steps.extract-image.outputs.image-name }}"
          echo "PR for image-update-$IMAGE_NAME already exists, skipping creation."